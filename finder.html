        '<div class="f-head"><img loading="lazy" src="https://www.google.com/s2/favicons?domain=' + t.domain + '&sz=64" alt="">' +
        '<strong>' + t.name + '</strong></div>' +
        '<p class="f-desc">' + t.desc + '</p>' +
        '<p class="f-why">' + why + '</p>' +
        '<div class="f-row"><a class="f-cta" href="' + t.link + '" target="_blank" rel="sponsored noopener">Visit ' + t.name + ' →</a>' + hands + '</div>' +
        '</div>');
    });
    if (!cards.length){ cards = [h('<p class="f-desc">No direct match — browse the full directory below.</p>')]; }
    var ftM = FREE.filter(function(f){ return f.cat === state.cat; });
    var ftS = ftM.filter(function(f){ return f.sub === state.sub; });
    var ft = ftS[0] || ftM[0];
    var ftNode = ft ? [h('<div class="f-card"><span class="f-best" style="background:#3b82f6">Free tool</span>' +
      '<div class="f-head"><strong>' + ft.name + '</strong></div>' +
      '<p class="f-desc">' + ft.desc + '</p>' +
      '<div class="f-row"><a class="f-cta" href="https://aibuildermarketplace.com/tools/' + ft.slug + '/" target="_blank" rel="nofollow noopener">Open free tool &rarr;</a></div></div>')] : [];
    render('<p class="f-q">My recommendation' + (cards.length > 1 ? 's' : '') + ':</p>', cards.concat(ftNode).concat([
      matchForm(top),
      h('<div class="f-row" style="margin-top:14px"><a class="f-alt" href="https://aibuildermarketplace.com/b2b/" target="_blank" rel="nofollow noopener">Browse the full directory →</a></div>'),
      back(step1, 'Start over')
    ]));
  }
  function matchForm(top){
    var f = h('<form class="f-match" novalidate>' +
      '<p class="f-match-h">Want a personal second opinion on this shortlist?</p>' +
      '<p class="f-match-p">Tell me a little about your situation and I will reply by email with the trade-offs between these picks for your case. No newsletter, and your details are never shared with vendors.</p>' +
      '<div class="f-match-grid">' +
      '<label>Company size<select name="size"><option value="">Choose…</option><option value="solo">Just me</option><option value="2-10">2–10 people</option><option value="11-50">11–50 people</option><option value="51-200">51–200 people</option><option value="200+">200+ people</option></select></label>' +
      '<label>Monthly software budget<select name="budget"><option value="">Choose…</option><option value="free">Free only</option><option value="<50">Under $50</option><option value="50-200">$50–200</option><option value="200-1000">$200–1,000</option><option value="1000+">$1,000+</option></select></label>' +
      '</div>' +
      '<label>Email <input type="email" name="email" placeholder="you@company.com" required></label>' +
      '<label>What are you trying to fix? <span class="f-match-opt">(optional)</span><textarea name="note" rows="3" maxlength="600" placeholder="One or two sentences is plenty."></textarea></label>' +
      '<input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">' +
      '<div class="f-row"><button type="submit" class="f-cta">Send my shortlist for a second opinion</button><span class="f-match-msg" aria-live="polite"></span></div>' +
      '</form>');
    f.addEventListener('submit', function(ev){
      ev.preventDefault();
      var msg = f.querySelector('.f-match-msg');
      var email = (f.email.value || '').trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = 'Please enter a valid email address.'; return; }
      var btn = f.querySelector('button'); btn.disabled = true; msg.textContent = 'Sending…';
      var payload = {site: 'zerotouchsupport.com', cat: state.cat, sub: state.sub,
        top: top.map(function(t){ return t.name; }), size: f.size.value, budget: f.budget.value,
        email: email, note: (f.note.value || '').trim(), website: f.website.value, page: location.pathname};
      fetch('https://api.aibuildermarketplace.com/matchmaker', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
        .then(function(r){ return r.json().then(function(j){ return {ok: r.ok, j: j}; }); })
        .then(function(x){
          if (!x.ok) { throw new Error(x.j && x.j.error ? x.j.error : 'error'); }
          track('matchmaker_submit', {finder_cat: state.cat, finder_sub: state.sub, mm_size: payload.size, mm_budget: payload.budget});
          f.innerHTML = '<p class="f-match-h">Thanks — it is on its way to Daniel.</p><p class="f-match-p">He reads every one himself and replies personally, usually within two working days.</p>';
        })
        .catch(function(e){ btn.disabled = false; msg.textContent = 'That did not go through (' + (e.message || 'network') + '). Email daniel@aibuildermarketplace.com instead.'; });
    });
    return f;
  }
  function btn(label, fn){ var b = h('<button class="f-btn">' + label + '</button>'); b.addEventListener('click', fn); return b; }
  function back(fn, label){ var b = h('<button class="f-back">' + (label || '← Back') + '</button>'); b.addEventListener('click', fn); return b; }
  function render(qhtml, nodes){
    root.innerHTML = qhtml;
    var wrap = h('<div class="f-opts"></div>');
    nodes.forEach(function(n){ wrap.appendChild(n); });
    root.appendChild(wrap);
  }
  step1();
})();

  </script>
</body>
</html>
